<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Уведомление о записи</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">

<table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-color: #ffffff; margin-top: 20px; border: 1px solid #dddddd;">
    <tr>
        <td style="padding: 40px 30px; background-color: #007bff; color: #ffffff; text-align: center;">
            <h1 style="margin: 0; font-size: 24px;">Подтверждение записи</h1>
        </td>
    </tr>
    <tr>
        <td style="padding: 30px;">
            <p style="font-size: 18px; color: #333333; margin-top: 0;">
                Здравствуйте,
                <strong th:text="${firstName}"/>
            </p>
            <p style="font-size: 16px; color: #555555; line-height: 1.5;">
                Вы успешно записаны в нашу систему. Мы будем рады видеть вас в назначенное время.
            </p>
            <p style="font-size: 16px; color: #555555; line-height: 1.5;">
                Если у вас возникнут вопросы, вы можете ответить на это письмо.
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding: 20px 30px; background-color: #eeeeee; color: #888888; font-size: 12px; text-align: center;">
            <p style="margin: 0;">Это автоматическое уведомление, на него не нужно отвечать.</p>
            <p style="margin: 5px 0 0 0;">&copy; 2026 Ваша Организация</p>
        </td>
    </tr>
</table>

</body>
</html>
